[package]
name = "ysm-summon-editor"
description = "Desktop editor for Rappelz summon data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ysm-core.workspace = true
ysm-data.workspace = true
rust_decimal.workspace = true

eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.36", default-features = false }
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "dds", "webp", "ico"] }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
egui_kittest = { version = "0.36", default-features = false }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
